.newman_rafs_tests:
  tags: ["osdu-small"]
  stage: integration
  image:
    name: dannydainton/htmlextra
    entrypoint: [""]
  needs: ["azure_deploy"]
  allow_failure: false
  environment:
    name: AZURE_GLAB
  before_script:
  - apk add --no-cache curl jq
  script:
  - echo "🔍 Checking service version via /info endpoint"
  - |
    curl -s https://${AZURE_DNS_NAME}/api/rafs-ddms/info | tee info.json
    branch=$(jq -r '.branch' info.json)
    echo "ℹ️ Branch reported by service: $branch"
    if [[ "$branch" != "${CI_COMMIT_REF_SLUG}" ]]; then
      echo "❌ Mismatch: expected branch to include ${CI_COMMIT_REF_SLUG}, but got $branch"
      exit 1
    fi
  - sleep 180 # Wait for the service to be ready
  - echo "▶️ Starting Newman tests"
  - |
    set -o pipefail
    newman run "$COLLECTION_JSON" \
      -e "$ENVIRONMENT" \
      --env-var "TENANT_ID=${TEST_AZURE_TENANT_ID}" \
      --env-var "CLIENT_ID=${TEST_AZURE_APP_ID}" \
      --env-var "CLIENT_SECRET=${TEST_AZURE_APP_SECRET}" \
      --reporters cli,htmlextra \
      --reporter-htmlextra-hideRequestBody "Refresh Token" \
      --reporter-htmlextra-export report-newman.html \
      --reporter-htmlextra-title "RAFS DDMS API Tests" \
      --insecure 2>&1 | tee newman.log
  - echo "📝 HTML Newman test report will be available in the job artifacts:"
  - echo "🔗 ${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/report-newman.html"
  - echo "📝 Job logs will be available in the job artifacts:"
  - echo "🔗 ${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/newman.log"
  artifacts:
    when: always
    paths:
      - report-newman.html
      - newman.log
    expire_in: 1 month
  rules:
    - if: '$AZURE == "1" && $AZURE_SKIP_DEPLOY != "true"'
      when: on_success
    - when: never

# --------------------------------------------------------------------------------

# This job is for running the Postman collection for the RAFS DDMS API
# against the OSDU Azure environment.

azure-postman-test:
  extends: .newman_rafs_tests
  variables:
    ENVIRONMENT: "./devops/azure/qa/Postman Collection/Environment/OSDU_AZURE_GLAB.postman_environment.json"
    COLLECTION_JSON: "./devops/azure/qa/Postman Collection/Collection/RAFS DDMS.postman_collection.json"
  retry:
    max: 1
    when: always
