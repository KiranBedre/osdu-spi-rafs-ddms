.get_version:
  script:
    - |
      VER=0.0.0-${CI_COMMIT_SHORT_SHA};
      if [[ -z $CI_COMMIT_TAG ]] && [[ $CI_COMMIT_BRANCH =~ ^release\/[0-9]{1,2}.[0-9]{1,2}$ ]]; 
      then
          RELEASE_VER=$(echo $CI_COMMIT_BRANCH | sed "s?^release/??");
          VER=$RELEASE_VER
      elif [[ $CI_COMMIT_TAG =~ ^v[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; 
      then
          VER=$(echo $CI_COMMIT_TAG | sed "s/^v//;s/-.*$//");
      fi;

containerize:
  tags: ["osdu-medium"]
  image: docker:24.0.1-cli
  stage: containerize
  needs: []
  variables:
    SHA_IMAGE: ${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHA}
    LATEST_IMAGE: ${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}:latest
    RELEASE_IMAGE: release-${CI_COMMIT_TAG}:${CI_PROJECT_NAME}-${CI_COMMIT_TAG}
  before_script:
    - apk add git
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - !reference [.get_version, script]
    - |
      docker buildx build --push --provenance=false \
      -f Dockerfile \
      --build-arg "build_date=$(TZ=UTC date)" \
      --build-arg "commit_id=$CI_COMMIT_SHORT_SHA" \
      --build-arg "commit_branch=$CI_COMMIT_REF_SLUG" \
      --build-arg "commit_message=$CI_COMMIT_MESSAGE" \
      --build-arg "release_version=$VER" \
      -t $CI_REGISTRY_IMAGE/$SHA_IMAGE \
      -t $CI_REGISTRY_IMAGE/$LATEST_IMAGE \
      .
    - |
      if [ ! -z "$CI_COMMIT_TAG" ]; then
        docker buildx build --push --provenance=false \
        -f Dockerfile \
        --build-arg "build_date=$(TZ=UTC date)" \
        --build-arg "commit_id=$CI_COMMIT_SHORT_SHA" \
        --build-arg "commit_branch=$CI_COMMIT_REF_SLUG" \
        --build-arg "commit_message=$CI_COMMIT_MESSAGE" \
        --build-arg "release_version=$VER" \
        -t $CI_REGISTRY_IMAGE/$RELEASE_IMAGE \
        .
      fi

cronjob-containerize:
  extends:
    - containerize
  variables:
    SHA_IMAGE: ${CI_PROJECT_NAME}-cronjob-${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHA}
    LATEST_IMAGE: ${CI_PROJECT_NAME}-cronjob-${CI_COMMIT_REF_SLUG}:latest
    RELEASE_IMAGE: release-${CI_COMMIT_TAG}:${CI_PROJECT_NAME}-cronjob-${CI_COMMIT_TAG}
  script:
    - !reference [.get_version, script]
    - |
      docker buildx build --push --provenance=false \
      -f ./devops/azure/cronjob/Dockerfile \
      --build-arg "release_version=$VER" \
      -t $CI_REGISTRY_IMAGE/$SHA_IMAGE \
      -t $CI_REGISTRY_IMAGE/$LATEST_IMAGE \
      ./devops/azure/cronjob/
    - |
      if [ ! -z "$CI_COMMIT_TAG" ]; then
        docker buildx build --push --provenance=false \
        -f ./devops/azure/cronjob/Dockerfile \
        --build-arg "release_version=$VER" \
        -t $CI_REGISTRY_IMAGE/$RELEASE_IMAGE \
        ./devops/azure/cronjob/
      fi