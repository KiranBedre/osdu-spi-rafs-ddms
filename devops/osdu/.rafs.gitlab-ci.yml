# RAFS Specific jobs

# Build image for rafs tests
build_rafs_tests:
  stage: build
  image: docker:24.0.1-cli
  tags: ["osdu-medium"]
  extends:
    - .skipForTriggeringMergeRequests
  before_script:
    - apk add git && docker buildx create --use
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Keep --cache-from only: --cache-to has been flaking on registry OAuth 502s
    # while the image layers themselves are already built, which blocks
    # cimpl-prod-test-python (needs build-${CI_COMMIT_SHA}).
    - >
      docker buildx build --push -t ${CI_REGISTRY_IMAGE}:build-latest -t ${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHA}
      --cache-from type=registry,ref=${CI_REGISTRY_IMAGE}:build-cache
      -f Dockerfile.tests .
  after_script:
    - docker buildx rm

# For quality check
rafs_openapi_sync_check:
  image: ${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHA}
  stage: scan
  tags: ["osdu-small"]
  extends:
    - .skipForTriggeringMergeRequests
  needs:
    - job: build_rafs_tests
  script:
    - python scripts/check_openapi_sync.py --app-env test --openapi-prefix "/${URL_PREFIX}" --cloud-provider ""

rafs_code_quality_check:
  image: ${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHA}
  stage: scan
  tags: ["osdu-small"]
  extends:
    - .skipForTriggeringMergeRequests
  variables:
    CONFIG_FILE: "setup.cfg"
  script:
    - pylint ${CI_PROJECT_DIR} --rcfile=${CONFIG_FILE} --errors-only
    # Flake8 hands indefinately within venv
    - flake8 ${CI_PROJECT_DIR} --config=${CONFIG_FILE}
    - flake8 ${CI_PROJECT_DIR} --select T1

# Local override for cimpl OpenAPI validation:
# keep live endpoint as JSON while allowing committed YAML specs.
.cimpl-check-openapi-spec:
  stage: acceptance
  image: alpine:3.23
  variables:
    CIMPL_API_BASE_URL: "https://${CIMPL_DNS_NAME}"
  tags: ["osdu-small"]
  before_script:
    - apk add --no-cache wget yq jq
  script:
    - LIVE_SPEC_EXT=".yaml"
    - COMMITTED_SPEC_EXT=".yaml"
    - |
      IS_PYTHON_SERVICE="false"
      if [ ! -f "pom.xml" ] && { [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; }; then
        IS_PYTHON_SERVICE="true"
      fi
    - |
      if [ -z "${CIMPL_OPENAPI_CONFIG_ROUTE}" ]; then
        CIMPL_OPENAPI_CONFIG_ROUTE="/api/${CIMPL_SERVICE}/api-docs/swagger-config"
      fi
    - |
      if [ -n "${CIMPL_OPENAPI_YAML_ROUTE}" ]; then
        echo "CIMPL_OPENAPI_YAML_ROUTE is set. Using '${CIMPL_OPENAPI_YAML_ROUTE}' as override"
        URLS="${CIMPL_OPENAPI_YAML_ROUTE}"
        if [[ "${URLS}" == *.json ]]; then
          LIVE_SPEC_EXT=".json"
        fi
      elif [ "${IS_PYTHON_SERVICE}" = "true" ]; then
        echo "Python service detected. Defaulting to JSON OpenAPI spec."
        URLS="/api/${CIMPL_SERVICE}/openapi.json"
        LIVE_SPEC_EXT=".json"
      else
        CONFIG_URL="${CIMPL_API_BASE_URL}${CIMPL_OPENAPI_CONFIG_ROUTE}"
        echo "Fetching swagger config from ${CONFIG_URL}"
        if wget -t 3 -T 30 --waitretry 30 -qO swagger-config.json "${CONFIG_URL}"; then
          URLS=$(jq -r '.url // .urls[].url' swagger-config.json | sed 's/api-docs/api-docs\.yaml/g')
        fi
        if [ -z "${URLS}" ]; then
          echo "No URLs found in swagger-config or fetch failed, falling back to default v1 route"
          URLS="/api/${CIMPL_SERVICE}/v1/api-docs.yaml"
        fi
      fi
    - |
      if [ -z "${CIMPL_OPENAPI_SPEC_PATH}" ]; then
        echo "CIMPL_OPENAPI_SPEC_PATH not set, using default"
        CIMPL_OPENAPI_SPEC_PATH="docs/api/community/v1/openapi.yaml"
      fi
      if [[ "${CIMPL_OPENAPI_SPEC_PATH}" == *.json ]]; then
        COMMITTED_SPEC_EXT=".json"
      fi
      echo "Committed spec path: ${CIMPL_OPENAPI_SPEC_PATH}"
      echo "Live spec format: ${LIVE_SPEC_EXT}; committed spec format: ${COMMITTED_SPEC_EXT}"
    - EXIT_CODE=0
    - NUM_FAILED=0
    - NUM_URLS=$(echo "${URLS}" | wc -w)
    - LOCAL_VERSIONS=$(ls docs/api/community 2>/dev/null || true)
    - |
      for URL in ${URLS}; do
        VERSION=$(basename "${URL}" .yaml)
        if [[ ! "$VERSION" =~ v[0-9] ]]; then
          VERSION=$(echo "${URL}" | grep -o 'v[0-9][^/?]*' | tail -n 1 || true)
          if [ -z "${VERSION}" ] && [ -n "${CIMPL_OPENAPI_SPEC_PATH}" ]; then
            VERSION=$(echo "${CIMPL_OPENAPI_SPEC_PATH}" | grep -o 'v[0-9][^/]*' | tail -n 1 || true)
          fi
          if [ -z "${VERSION}" ]; then VERSION="v1"; fi
        fi

        LOCAL_VERSIONS=$(echo "${LOCAL_VERSIONS}" | sed "s/${VERSION}//g" | xargs)

        if [ "${NUM_URLS}" -eq 1 ]; then
          LIVE_SPEC="live-openapi-spec${LIVE_SPEC_EXT}"
        else
          LIVE_SPEC="live-openapi-spec-${VERSION}${LIVE_SPEC_EXT}"
        fi

        if [ -n "${CIMPL_OPENAPI_SPEC_PATH}" ]; then
          CURRENT_SPEC_PATH="${CIMPL_OPENAPI_SPEC_PATH}"
        else
          CURRENT_SPEC_PATH="docs/api/community/${VERSION}/openapi${COMMITTED_SPEC_EXT}"
        fi

        echo "Checking OpenAPI spec for version ${VERSION} (URL: ${CIMPL_API_BASE_URL}${URL}, Local: ${CURRENT_SPEC_PATH})"

        FETCH_URL="${CIMPL_API_BASE_URL}${URL}"
        if ! wget -t 3 -T 30 --waitretry 30 -qO "${LIVE_SPEC}" "${FETCH_URL}"; then
          echo "Failed to fetch OpenAPI spec from ${FETCH_URL}"
          EXIT_CODE=1
          NUM_FAILED=$((NUM_FAILED + 1))
          continue
        fi

        if grep -q '##default' "${LIVE_SPEC}"; then
          echo "--------------------------------------------------------------------------------"
          echo "Live OpenAPI spec for ${VERSION} contains '##default' markers."
          echo "This indicates degraded spec generation, likely caused by a dependency version change in the service."
          echo "Affected lines:"
          grep -n '##default' "${LIVE_SPEC}"
          echo "--------------------------------------------------------------------------------"
          EXIT_CODE=1
          NUM_FAILED=$((NUM_FAILED + 1))
          continue
        fi

        if [ ! -f "${CURRENT_SPEC_PATH}" ]; then
          echo "Committed OpenAPI spec couldn't be found at ${CURRENT_SPEC_PATH}"
          mkdir -p "$(dirname "${CURRENT_SPEC_PATH}")"
          if [[ "${COMMITTED_SPEC_EXT}" == ".json" ]]; then
            echo "{}" > "${CURRENT_SPEC_PATH}"
          else
            echo "{}" > "${CURRENT_SPEC_PATH}"
          fi
        fi

        SORTED_CURRENT="sorted-current-${VERSION}.json"
        SORTED_LIVE="sorted-live-${VERSION}.json"
        NUMERIC_NORMALIZE_FILTER='walk(if type == "number" then ((. * 1.0) | tostring) else . end)'

        if [[ "${COMMITTED_SPEC_EXT}" == ".json" ]]; then
          jq -S "${NUMERIC_NORMALIZE_FILTER}" "${CURRENT_SPEC_PATH}" > "${SORTED_CURRENT}"
        else
          yq -o=json '.' "${CURRENT_SPEC_PATH}" | jq -S "${NUMERIC_NORMALIZE_FILTER}" > "${SORTED_CURRENT}"
        fi

        if [[ "${LIVE_SPEC_EXT}" == ".json" ]]; then
          jq -S "${NUMERIC_NORMALIZE_FILTER}" "${LIVE_SPEC}" > "${SORTED_LIVE}"
        else
          yq -o=json '.' "${LIVE_SPEC}" | jq -S "${NUMERIC_NORMALIZE_FILTER}" > "${SORTED_LIVE}"
        fi

        if ! diff -u "${SORTED_CURRENT}" "${SORTED_LIVE}"; then
          echo "--------------------------------------------------------------------------------"
          echo "The committed OpenAPI spec for ${VERSION} differs (or doesn't exist) from the one served by the running service."
          echo "--------------------------------------------------------------------------------"
          echo "To update the committed spec, run the following:"
          echo "$ mkdir -p ${CURRENT_SPEC_PATH%/*}"
          echo "$ wget -O ${CURRENT_SPEC_PATH} '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/${LIVE_SPEC}?inline=false'"
          echo "$ git add ${CURRENT_SPEC_PATH}"
          echo "$ git commit -m 'docs: update OpenAPI spec for ${VERSION} to match deployed service'"
          echo "$ git push"
          echo "--------------------------------------------------------------------------------"
          EXIT_CODE=1
          NUM_FAILED=$((NUM_FAILED + 1))
        else
          echo "OpenAPI spec for ${VERSION} is up to date."
        fi
      done
    - echo "${NUM_FAILED}/${NUM_URLS} OpenAPI specs need to be reviewed/updated"
    - |
      if [ -z "${CIMPL_OPENAPI_SPEC_PATH}" ] && [ -n "${LOCAL_VERSIONS}" ]; then
        echo "--------------------------------------------------------------------------------"
        echo "The following versions exist in docs/api/community but were not found in the service configuration: ${LOCAL_VERSIONS}"
        echo "Please remove these unused versions or update the service configuration."
        echo "--------------------------------------------------------------------------------"
        EXIT_CODE=1
      fi
    - exit $EXIT_CODE
  artifacts:
    when: on_failure
    paths:
      - live-openapi-spec*.yaml
      - live-openapi-spec*.json
    expire_in: 4 days
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /^release/"
      when: never
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$CIMPL == "1"'
      when: on_success

# Validate the deployed OpenAPI document on the CIMPL-STACK DEV environment.
cimpl-dev-check-openapi-spec:
  extends:
    - .cimpl-check-openapi-spec
    - .cimpl-dev-variables
  needs:
    - job: cimpl-dev-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release/'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CIMPL_STACK == "1" && $DEV == "1"'
      when: on_success
    - when: never

cimpl-dev-backup-check-openapi-spec:
  extends:
    - .cimpl-check-openapi-spec
    - .cimpl-dev-backup-variables
  needs:
    - job: cimpl-dev-backup-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release/'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CIMPL_STACK == "1" && $DEV_BACKUP == "1"'
      when: on_success
    - when: never
