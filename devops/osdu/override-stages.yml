compile-and-unit-test:
  image: mcr.microsoft.com/mirror/docker/library/python:3.11-slim
  variables:
    PIP_CMD: pip
    PIP_REQUIREMENTS: >
      requirements.txt
    PYTEST_COV: app
    PYTEST_DIR: ./tests
    PYTEST_OPTIONS: >
      -p no:cacheprovider
      --ignore=${CI_PROJECT_DIR}/tests/integration
    PIP_REQUIREMENTS_TOOLING_ONLY: >-
      requirements-tests.in

sonarqube-scan-python:
  tags: ["osdu-medium"]

.ultimate-scanner-config:
  needs:
  - job: compile-and-unit-test
    optional: true
  variables:
    SECRET_DETECTION_EXCLUDED_PATHS: devops/azure/qa/Postman Collection/Collection/RAFS DDMS.postman_collection.json,devops/core-plus/qa/Postman Collection/Collection/RAFS DDMS.postman_collection.json

secret_detection:
  rules:
    - if: $SECRET_DETECTION_DISABLED == 'true' || $SECRET_DETECTION_DISABLED == '1'
      when: never
    - if: $CI_MERGE_REQUEST_ID
      variables:
        SECURE_LOG_LEVEL: debug
    - if: $CI_COMMIT_BRANCH && $CI_MERGE_REQUEST_ID == null
      variables:
        SECURE_LOG_LEVEL: info
    - if: $CI_COMMIT_TAG
      variables:
        SECURE_LOG_LEVEL: info
