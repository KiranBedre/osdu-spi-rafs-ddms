variables:
  GC_SERVICE: rafs-ddms
  GC_INT_TEST_TYPE: python
  GC_SUPPORTED_PLATFORM: "linux/amd64"

gc-helm-charts-gitlab:
  # Not allowed to fail the pipeline: .commits_behind_main_check (shared
  # ci-cd-pipelines) always compares against CI_DEFAULT_BRANCH (main)
  # instead of the MR's real target, so it false-positives on any MR
  # targeting a long-lived branch like v0.30.10. See job 4563892
  # on pipeline 387888 (MR !745, target v0.30.10).
  allow_failure: true

gc-containerize-gitlab:
  variables:
    BUILD_PATH: "./devops/gc/Dockerfile"
    BUILD_ARGS: >
      --build-arg build_date="$CI_JOB_STARTED_AT"
      --build-arg commit_id=$CI_COMMIT_SHORT_SHA
      --build-arg commit_branch=$CI_COMMIT_BRANCH
      --build-arg user_id=65532

gc-containerize-gcr:
  variables:
    BUILD_PATH: "./devops/gc/Dockerfile"
    BUILD_ARGS: >
      --build-arg build_date="$CI_JOB_STARTED_AT"
      --build-arg commit_id=$CI_COMMIT_SHORT_SHA
      --build-arg commit_branch=$CI_COMMIT_BRANCH
      --build-arg user_id=65532

gc-acceptance-test-python:
  extends:
    - .gc-variables
  image: python:3.11
  script:
    - curl https://community.opengroup.org/api/v4/projects/1410/packages/generic/gc_auth_token/master/gc_auth_token -o gc_auth_token
    - chmod +x gc_auth_token
    - export GOOGLE_APPLICATION_CREDENTIALS=$GC_INTEGRATION_TESTER_SA_FILE
    - export GC_TOKEN=$(./gc_auth_token)
    - pip install -r requirements.txt
    - pip install -r requirements-tests.in
    - >-
      pytest -n auto --maxfail=5 tests/integration/tests
      --ddms-base-url ${DDMS_BASE_URL}
      --url-prefix ${URL_PREFIX}
      --partition ${DATA_PARTITION_ID}
      --bearer-token ${GC_TOKEN}
      --cloud-provider ${CLOUD_PROVIDER}
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /^release/"
      when: never
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$GC == "1" && $GC_INT_TEST_TYPE == "python"'
      when: on_success
