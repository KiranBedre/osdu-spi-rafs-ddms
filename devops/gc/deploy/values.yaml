global:
  domain: ""
  limitsEnabled: true
  tier: ""
  autoscalingMode: "cpu"

data:
  # Configmaps
  cloudProvider: "gc"
  openapiPrefix: "/api/rafs-ddms"
  storageHost: "http://storage"
  searchHost: "http://search"
  partitionHost: "http://partition"
  datasetHost: "http://dataset"
  schemaHost: "http://schema"
  entitlementsHost: "http://entitlements"
  # Redis connection
  cacheEnable: "True"
  cacheBackend: "app.core.helpers.cache.backends.redis_cache.RedisCacheBackend"
  enableApiV1: "True"
  # Update 'redisRafsDdmsHost' var if you want to use external Redis
  redisRafsDdmsHost: ""
  redisRafsDdmsDatabase: "13"
  redisRafsDdmsSsl: "False"
  redisRafsDdmsPort: "6379"
  redisIndexEnable: "True"
  # Deployments
  requestsCpu: "50m"
  requestsMemory: "350Mi"
  limitsCpu: "2"
  limitsMemory: "3G"
  redisRequestsCpu: "10m"
  redisRequestsMemory: "50Mi"
  redisImage: "docker.io/library/redis:7.2-alpine"
  image: ""
  imagePullPolicy: "IfNotPresent"
  serviceAccountName: "rafs-ddms"
  affinityLabelsSpot:
    cloud.google.com/gke-provisioning:
      - spot

conf:
  configmap: "rafs-ddms-config"
  appName: "rafs-ddms"
  rafsDdmsRedisSecretName: "rafs-ddms-redis-secret"

istio:
  redisProxyCPU: "50m"
  redisProxyMemory: "100Mi"

hpa:
  minReplicas: 1
  maxReplicas: 6
  cpu:
    utilization: 200
    scaleUpStabilizationWindowSeconds: 30
    scaleUpValue: 200
    scaleUpPeriod: 15
    scaleDownStabilizationWindowSeconds: 150
    scaleDownValue: 100
    scaleDownPeriod: 15
  requests:
    targetType: "AverageValue"
    targetValue: 140 ## TODO: Perform additional performance tests to refine the request value.
    scaleUpStabilizationWindowSeconds: 10
    scaleUpValue: 50
    scaleUpPeriod: 15
    scaleDownStabilizationWindowSeconds: 60
    scaleDownValue: 25
    scaleDownPeriod: 60

limits:
  max_tokens: 100
  tokens_per_fill: 100
  fill_interval: "1s"
