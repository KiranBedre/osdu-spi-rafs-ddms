{{- if .Values.rosa }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-cronjob" .Values.conf.appName | quote }}
  namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "nonroot-scc-%s-cronjob" .Values.conf.appName | quote }}
  namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-cronjob" .Values.conf.appName | quote }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
