{{- if and .Values.cronjobEnabled .Values.data.cronJobImage }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.conf.cronJobSecretName | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ .Values.conf.appName | quote }}
type: Opaque
stringData:
  CLIENT_ID: {{ .Values.data.cronJobClientId | quote }}
  CLIENT_SECRET: {{ .Values.data.cronJobClientSecret | quote }}
{{- end }}
