apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.data.serviceAccountName | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ .Values.conf.appName | quote }}
    type: ddms
---
# --- Base Role (access to ConfigMap/Secret) ---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.conf.appName }}-role
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.conf.appName | quote }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
# --- Bind SA to Base Role ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.conf.appName }}-binding
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.conf.appName | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.data.serviceAccountName | quote }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.conf.appName }}-role
  apiGroup: rbac.authorization.k8s.io
--- 
# --- Extra RoleBinding for OpenShift SCC
{{- if .Values.rosa }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nonroot-scc-{{ .Values.data.serviceAccountName }}
  namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: {{ .Values.data.serviceAccountName }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
