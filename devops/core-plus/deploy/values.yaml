enabled: true

global:
  limitsEnabled: true
  # To be set in pipeline by job "cimpl-deploy"
  domain: ""
  dataPartitionId: ""
  onPremEnabled: ""
  RAFS_URI: ""

# --------------------
# Application-level configuration
# --------------------
conf:
  appName: "rafs-ddms"
  replicas: 1
  configmap: "rafs-ddms-config"
  serviceAccountName: "rafs-ddms"
  rafsDdmsRedisSecretName: "rafs-ddms-redis-secret"
  cronJobSecretName: "rafs-ddms-secret"

data:
  # --------------------
  # Images (to be set in pipeline by job tamplate ".cimpl_substitute_service_and_cronjob_images_in_helm")
  # --------------------
  image: ""
  redisImage: ""
  cronJobImage: ""
  imagePullPolicy: "IfNotPresent"

  # --------------------
  # Resource Requests / Limits
  # --------------------
    # application
  requestsCpu: "50m"
  requestsMemory: "350Mi"
  limitsCpu: "2"
  limitsMemory: "3G"
    # redis
  redisRequestsCpu: "5m"
  redisRequestsMemory: "50Mi"
    # cronjob
  cronJobRequestsCpu: "64m"
  cronJobRequestsMemory: "64Mi"
  cronJobLimitsCpu: "100m"
  cronJobLimitsMemory: "128Mi"

  # --------------------
  # Environment configuration (to be set in pipeline by job "cimpl-deploy")
  # --------------------
  logLevel: ""
  bucketPrefix: ""
  groupId: ""
  sharedTenantName: ""
  bucketName: ""
  # Configmap 
    ## Hosts
  openapiPrefix: "/api/rafs-ddms"
  storageHost: "http://storage"
  searchHost: "http://search"
  partitionHost: "http://partition"
  datasetHost: "http://dataset"
  schemaHost: "http://schema"
  entitlementsHost: "http://entitlements"
    # Features
  RAFS_USE_BLOB_STORAGE: "False"
  enableApiV1: "True"

  # --------------------
  # Redis Configuration
  # --------------------
  redisRafsDdmsHost: "" # Update var if you want to use external Redis
  redisRafsDdmsPort: "6379"
  redisRafsDdmsDatabase: "13"
  redisRafsDdmsSsl: "False"
  redisIndexEnable: "True"
  redisRafsDdmsstorageclass: "" # by default for ROSA/OpenShift will be used gp3-csi storage class
  redisRafsDdmsstorage: 1Gi
  
  cacheEnable: "True"
  cacheBackend: "app.core.helpers.cache.backends.redis_cache.RedisCacheBackend"
  
  # --------------------
  # CronJob
  # --------------------
  cronjobEnabled: true
  cronJobSchedule: "0 * * * *"  # Daily each hour
  cronJobstartingDeadlineSeconds: 600 # 10 min - it should be less than cronjob period
  oauthTokenUrl: ""
  oauthScope: "openid profile offline_access email"

  # --------------------
  # Otel
  # --------------------
  pythonToolOptions: ""
  otelExporterEndpoint: ""
  otelExporterProtocol: ""

istio:
  redisProxyCPU: "50m"
  redisProxyMemory: "100Mi"
