variables:
  CIMPL_SERVICE: rafs-ddms
  CIMPL_INT_TEST_TYPE: python
  CIMPL_SUPPORTED_PLATFORM: "linux/amd64"
  CIMPL_IMAGE_REDIS_NAME: cimpl-redis-stack-server
  REDIS_REPO: "docker.io/redis/redis-stack-server"
  REDIS_VERSION: "7.4.0-v8"
  CIMPL_IMAGE_CRONJOB_NAME: cimpl-rafs-ddms-cronjob
  # Python equivalent of CIMPL_OTEL_JAVA_TOOL_OPTIONS for Java services.
  # Set to "opentelemetry-instrument" to activate the OTEL agent at runtime.
  CIMPL_OTEL_PYTHON_TOOL_OPTIONS: "opentelemetry-instrument"
  # Python uses HTTP/protobuf exporter (port 4318). Java uses gRPC (port 4317).
  # gRPC would require adding opentelemetry-exporter-otlp-proto-grpc + grpcio to requirements.
  CIMPL_OTEL_PYTHON_EXPORTER_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
  CIMPL_OTEL_PYTHON_EXPORTER_PROTOCOL: "http/protobuf"

.cimpl_get_version:
  script:
    - |
      CIMPL_VERSION="0.0.0-${CI_COMMIT_SHORT_SHA}"
      if [ -z "$CI_COMMIT_TAG" ] && echo "$CI_COMMIT_BRANCH" | grep -Eq "^release/[0-9]{1,2}\.[0-9]{1,2}$"; then
        RELEASE_VERSION=$(echo "$CI_COMMIT_BRANCH" | sed "s?^release/??")
        CIMPL_VERSION="$RELEASE_VERSION"
      elif echo "$CI_COMMIT_TAG" | grep -Eq "^v[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$"; then
        CIMPL_VERSION=$(echo "$CI_COMMIT_TAG" | sed "s/^v//;s/-.*$//")
      fi
      echo "CIMPL_VERSION=$CIMPL_VERSION"

.cimpl_substitute_service_images_in_helm:
  script:
    - wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && chmod +x /usr/bin/yq
    - IMAGE="$CI_REGISTRY_IMAGE/$CIMPL_IMAGE_NAME:$IMAGE_TAG" yq -i '.data.image = env(IMAGE)' $CIMPL_HELM_DEPLOYMENT_DIR/values.yaml
    - REDIS_IMAGE="$CI_REGISTRY_IMAGE/$CIMPL_IMAGE_REDIS_NAME:$REDIS_VERSION" yq -i '.data.redisImage = env(REDIS_IMAGE)' $CIMPL_HELM_DEPLOYMENT_DIR/values.yaml

.cimpl_substitute_cronjob_image_in_helm:
  script:
    - CRONJOB_IMAGE="$CI_REGISTRY_IMAGE/$CIMPL_IMAGE_NAME:$IMAGE_TAG" yq -i '.data.cronJobImage = env(CRONJOB_IMAGE)' $CIMPL_HELM_DEPLOYMENT_DIR/values.yaml

.cimpl_python_test_report:
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit: integration_tests_report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

.cimpl_buildx_setup:
  script:
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --driver docker-container --use
    - docker buildx inspect --bootstrap

.get_cimpl_access_token:
  script:
    - |
      # Dev1: keycloak.$CIMPL_DOMAIN ; Prod: keycloak-$CIMPL_DOMAIN (see TEST_OPENID_PROVIDER_URL)
      OIDC_BASE="${TEST_OPENID_PROVIDER_URL:-${CIMPL_TOKEN_URI}"
      OIDC_BASE="$(echo "$OIDC_BASE" | tr -d '[:space:]')"
      TOKEN_URL="${OIDC_BASE%/}/protocol/openid-connect/token"
      OIDC_CLIENT_ID="${TEST_OPENID_PROVIDER_CLIENT_ID:-${CIMPL_CLIENT_ID}}"
      OIDC_CLIENT_SECRET="${TEST_OPENID_PROVIDER_CLIENT_SECRET:-${CIMPL_CLIENT_SECRET}}"
      echo "Requesting access token from Keycloak..."
      echo "Token URL: ${TOKEN_URL}"
      TOKEN_RESP=$(curl --fail-with-body -sS -L --connect-timeout 30 --max-time 90 -X POST \
        "${TOKEN_URL}" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "client_id=${OIDC_CLIENT_ID}" \
        -d "client_secret=${OIDC_CLIENT_SECRET}" \
        -d "grant_type=client_credentials" \
        -d "scope=openid profile offline_access email") || {
          echo "Failed to call Keycloak token endpoint (curl exit $?)"
          echo "CIMPL_DOMAIN=${CIMPL_DOMAIN}"
          exit 1
        }
      ACCESS_TOKEN=$(echo "$TOKEN_RESP" | jq -r .access_token)
      if [[ -z "$ACCESS_TOKEN" || "$ACCESS_TOKEN" == "null" ]]; then
        echo "Failed to obtain access token from Keycloak"
        echo "$TOKEN_RESP" | jq -c '{error, error_description}' 2>/dev/null || echo "$TOKEN_RESP" | head -c 200
        exit 1
      fi
      echo "Access token successfully retrieved from Keycloak"
      echo "$ACCESS_TOKEN" | head -c 10
      echo ""
      export ACCESS_TOKEN
      # The integration suite runs longer than the token lifetime, so pytest gets
      # the credentials to re-mint it (see client/token_provider.py) instead of
      # every request after the first few minutes failing on "Jwt is expired".
      export RAFS_OIDC_TOKEN_URL="$TOKEN_URL"
      export RAFS_OIDC_CLIENT_ID="$OIDC_CLIENT_ID"
      export RAFS_OIDC_CLIENT_SECRET="$OIDC_CLIENT_SECRET"

cimpl-containerize-gitlab:
  needs:
    - job: compile-and-unit-test
      optional: true
  variables:
    CIMPL_BUILD_CONTEXT: "."
    CIMPL_BUILD_PATH: "./Dockerfile"
  script:
    - !reference [.cimpl_get_version, script]
    - !reference [.cimpl_set_image_name, script]
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - !reference [.cimpl_buildx_setup, script]
    - >
      docker buildx build --provenance=false
      --platform $CIMPL_SUPPORTED_PLATFORM
      $EXTRA_TAG
      -t $CI_REGISTRY_IMAGE/$CIMPL_IMAGE_NAME
      -f $CIMPL_BUILD_PATH
      --build-arg build_date="$CI_JOB_STARTED_AT"
      --build-arg commit_id="$CI_COMMIT_SHORT_SHA"
      --build-arg commit_branch="$CI_COMMIT_BRANCH"
      --build-arg commit_message="$CI_COMMIT_MESSAGE"
      --build-arg release_version="$CIMPL_VERSION"
      --push $CIMPL_BUILD_CONTEXT
#  one time action
    # - docker pull $REDIS_REPO:$REDIS_VERSION
    # - docker tag $REDIS_REPO:$REDIS_VERSION $CI_REGISTRY_IMAGE/$CIMPL_IMAGE_REDIS_NAME:$REDIS_VERSION
    # - docker push $CI_REGISTRY_IMAGE/$CIMPL_IMAGE_REDIS_NAME:$REDIS_VERSION

cimpl-cronjob-containerize-gitlab:
  extends:
    - cimpl-containerize-gitlab
  needs:
    - job: compile-and-unit-test
      optional: true
  variables:
    CIMPL_BUILD_CONTEXT: "./devops/core-plus/cronjob"
    CIMPL_BUILD_PATH: "./devops/core-plus/cronjob/Dockerfile"
    CIMPL_IMAGE_NAME: $CIMPL_IMAGE_CRONJOB_NAME

cimpl-helm-charts-gitlab:
  before_script:
    - helm registry login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # set & substitute service images in helm chart
    - !reference [.cimpl_set_image_name, script]
    - !reference [.cimpl_substitute_service_images_in_helm, script]
    # set & substitute cronjob image in helm chart
    - CIMPL_IMAGE_NAME="$CIMPL_IMAGE_CRONJOB_NAME"
    - !reference [.cimpl_set_image_name, script]
    - !reference [.cimpl_substitute_cronjob_image_in_helm, script]
    - cat $CIMPL_HELM_DEPLOYMENT_DIR/values.yaml | grep -i image

.rafs_cimpl_integration_variables:
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PARTITION: $CIMPL_TENANT
    # Dev1: osdu.dev1.... ; Prod overrides to https://$CIMPL_DOMAIN (no tenant subdomain)
    CIMPL_RAFS_BASE_URL: "https://${CIMPL_TENANT}.${CIMPL_DOMAIN}"
    SERVICE_HOST_STORAGE: ${CIMPL_RAFS_BASE_URL}/api/storage/v2
    SERVICE_HOST_LEGAL: ${CIMPL_RAFS_BASE_URL}/api/legal/v1
    SERVICE_HOST_SEARCH: ${CIMPL_RAFS_BASE_URL}/api/search/v2
    RAFS_USE_BLOB_STORAGE: "False"

.rafs_cimpl_pytest_integration:
  image: ${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHA}
  extends:
    - .rafs_cimpl_integration_variables
    - .cimpl_python_test_report
  before_script:
    - apt-get update -qq
    - apt-get install -qq -y curl jq default-jre-headless nodejs npm
    - export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
    - export PATH="$JAVA_HOME/bin:$PATH"
    - npm install -g allure-commandline
    - pip install allure-pytest
    - !reference [.get_cimpl_access_token, script]
  script:
    - |
      echo "DEBUG"
      echo "Verifying required reference data before pytest"
      for RECORD_ID in \
        "osdu:reference-data--DepthShiftType:CoreToWellLog" \
        "osdu:reference-data--WellLogSamplingDomainType:SeismicOneWayTravelTime"
      do
        HTTP_CODE="$(curl --silent --show-error --insecure \
          --output /tmp/reference-data-check.json \
          --write-out "%{http_code}" \
          --header "Authorization: Bearer ${ACCESS_TOKEN}" \
          --header "data-partition-id: ${CIMPL_TENANT}" \
          "${SERVICE_HOST_STORAGE}/records/${RECORD_ID}")"

        echo "${RECORD_ID}: Storage HTTP ${HTTP_CODE}"
        cat /tmp/reference-data-check.json

        [ "$HTTP_CODE" = "200" ] || exit 1
      done
      echo "Reference data verification completed"
      # Envoy answers 503 "no healthy upstream" until the deployment has ready
      # pods, which otherwise fails the first minutes of tests. Any real HTTP
      # reply (401 included) proves the route is serving.
      HEALTH_URL="${CIMPL_RAFS_BASE_URL%/}/${URL_PREFIX#/}"
      HEALTH_URL="${HEALTH_URL%/}/healthz"
      echo "Waiting for ${HEALTH_URL} to serve"
      for attempt in $(seq 1 30); do
        HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$HEALTH_URL") || HTTP_CODE=000
        case "$HTTP_CODE" in
          000|502|503|504)
            echo "  attempt ${attempt}: ${HTTP_CODE}, retrying in 10s"
            sleep 10
            ;;
          *)
            echo "  service responded with ${HTTP_CODE}"
            break
            ;;
        esac
      done
    - |
      echo "Running integration tests against ${CIMPL_RAFS_BASE_URL}"
      mkdir -p tests/cimpl/allure-results
      time pytest \
        --tb=long \
        --reruns 1 \
        --reruns-delay 3 \
        --maxfail=0 \
        -n 2 \
        --dist=loadscope \
        --durations=50 \
        --junitxml=integration_tests_report.xml \
        --cov=app \
        --cov-report=xml:coverage.xml \
        --cov-report=term \
        --alluredir=tests/cimpl/allure-results \
        ./tests/integration/tests \
        --ddms-base-url "${CIMPL_RAFS_BASE_URL}" \
        --url-prefix "${URL_PREFIX}" \
        --bearer-token "${ACCESS_TOKEN}" \
        --partition "${PARTITION}" \
        --cloud-provider "cimpl"
  after_script:
    - allure generate tests/cimpl/allure-results --clean -o allure-report
  artifacts:
    paths:
      - tests/cimpl/allure-results/
      - allure-report/
    when: always
    expire_in: 1 week

# Seed the complete, deterministic set of reference-data records required by
# RAFS integration fixtures directly through Storage.
.rafs_cimpl_reference_bootstrap:
  stage: integration
  tags: ["osdu-medium"]

  image:
    name: node:alpine
  needs:
    - job: cimpl-deploy
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "Seeding RAFS integration reference data"
      sleep 60
      CATALOG="$CI_PROJECT_DIR/deployments/reference-data/rafs_integration_reference_data.json"
      RENDERED_CATALOG="/tmp/rafs_integration_reference_data.json"
      RECORD_IDS="/tmp/rafs-reference-data-ids.txt"
      RESTORE_RESPONSE="/tmp/reference-data-restore-response.json"
      VERIFY_RESPONSE="/tmp/reference-data-verify-response.json"

      OIDC_CLIENT_ID="${TEST_OPENID_PROVIDER_CLIENT_ID:-${CIMPL_CLIENT_ID}}"
      OIDC_CLIENT_SECRET="${TEST_OPENID_PROVIDER_CLIENT_SECRET:-${CIMPL_CLIENT_SECRET}}"

      SEED_HOSTNAME="${CIMPL_SEED_HOSTNAME:-${CIMPL_TENANT}.${CIMPL_DOMAIN}}"
      OIDC_BASE="${TEST_OPENID_PROVIDER_URL:-${CIMPL_SEED_OIDC_BASE:-${CIMPL_TOKEN_URI}"
      OIDC_BASE="$(echo "$OIDC_BASE" | tr -d '[:space:]')"

      TOKEN_FETCH_URL="${OIDC_BASE%/}/protocol/openid-connect/token"
      STORAGE_URL="https://${SEED_HOSTNAME}/api/storage/v2"
      LEGAL_URL="https://${SEED_HOSTNAME}/api/legal/v1"
      BOOTSTRAP_LEGAL_TAG="${LEGAL_TAG:-osdu-demo-legaltag}"

      ACCESS_TOKEN="$(curl --silent --show-error --insecure \
        --request POST "$TOKEN_FETCH_URL" \
        --header "Content-Type: application/x-www-form-urlencoded" \
        --data-urlencode "grant_type=client_credentials" \
        --data-urlencode "client_id=${OIDC_CLIENT_ID}" \
        --data-urlencode "client_secret=${OIDC_CLIENT_SECRET}" \
        --data-urlencode "scope=openid" |
        jq -r '.access_token // empty')"

      if [ -z "$ACCESS_TOKEN" ]; then
        echo "Could not obtain an access token from ${TOKEN_FETCH_URL}"
        exit 1
      fi

      echo "Ensuring legal tag ${BOOTSTRAP_LEGAL_TAG} exists"

      jq -n \
        --arg name "$BOOTSTRAP_LEGAL_TAG" \
        '{
          name: $name,
          description: "Legal Tag added for RAFS DDMS integration tests",
          properties: {
            contractId: "123456",
            countryOfOrigin: ["US", "CA"],
            dataType: "Public Domain Data",
            exportClassification: "EAR99",
            originator: "RAFS DDMS CI",
            personalData: "No Personal Data",
            securityClassification: "Private",
            expirationDate: "2035-12-25"
          }
        }' > /tmp/rafs-legal-tag.json

      LEGAL_HTTP_CODE="$(curl --silent --show-error --insecure \
        --output "$CI_PROJECT_DIR/legal-tag-response.json" \
        --write-out "%{http_code}" \
        --request POST "${LEGAL_URL}/legaltags" \
        --header "Authorization: Bearer ${ACCESS_TOKEN}" \
        --header "data-partition-id: ${CIMPL_TENANT}" \
        --header "Content-Type: application/json" \
        --data-binary @/tmp/rafs-legal-tag.json)"

      if [ "$LEGAL_HTTP_CODE" != "200" ] &&
         [ "$LEGAL_HTTP_CODE" != "201" ] &&
         [ "$LEGAL_HTTP_CODE" != "409" ]; then
        echo "Legal-tag creation failed with HTTP ${LEGAL_HTTP_CODE}"
        cat "$CI_PROJECT_DIR/legal-tag-response.json"
        exit 1
      fi

      jq \
        --arg namespace "$CIMPL_TENANT" \
        --arg owners "data.default.owners@${CIMPL_TENANT}.group" \
        --arg viewers "data.default.viewers@${CIMPL_TENANT}.group" \
        --arg legalTag "$BOOTSTRAP_LEGAL_TAG" \
        --arg country "US" \
        '
        def substitute($source; $replacement):
          split($source) | join($replacement);

        walk(
          if type == "string" then
            substitute("{{NAMESPACE}}"; $namespace)
            | substitute("{{data-partition-id}}"; $namespace)
            | substitute("{{DATA_OWNERS_GROUP}}"; $owners)
            | substitute("{{DATA_VIEWERS_GROUP}}"; $viewers)
            | substitute("{{LEGAL_TAG}}"; $legalTag)
            | substitute("{{ISO_3166_ALPHA_2_CODE}}"; $country)
            | substitute("{{rafsddms-schema-authority}}"; "osdu")
          else
            .
          end
        )
        ' "$CATALOG" > "$RENDERED_CATALOG"

      jq -e '
        type == "array"
        and length > 0
        and all(.[];
          type == "object"
          and (.id | type == "string")
          and (.id | contains(":reference-data--"))
          and (.kind | type == "string")
          and (.kind | startswith("osdu:"))
        )
        and (
          (map(.id) | length)
          ==
          (map(.id) | unique | length)
        )
      ' "$RENDERED_CATALOG" >/dev/null || {
        echo "Rendered reference-data catalog is invalid, empty, or contains duplicate IDs"
        exit 1
      }

      jq -e '
        [.. | strings | select(test("\\{\\{[^}]+\\}\\}"))]
        | length == 0
      ' "$RENDERED_CATALOG" >/dev/null || {
        echo "Rendered catalog contains unresolved placeholders"
        exit 1
      }

      REFERENCE_DATA_COUNT="$(jq 'length' "$RENDERED_CATALOG")"

      echo "Uploading ${REFERENCE_DATA_COUNT} reference-data records to ${STORAGE_URL}/records"

      STORAGE_HTTP_CODE="$(curl --silent --show-error --insecure \
        --output "$CI_PROJECT_DIR/reference-data-seed-response.json" \
        --write-out "%{http_code}" \
        --request PUT "${STORAGE_URL}/records" \
        --header "Authorization: Bearer ${ACCESS_TOKEN}" \
        --header "data-partition-id: ${CIMPL_TENANT}" \
        --header "Content-Type: application/json" \
        --data-binary @"$RENDERED_CATALOG")"

      if [ "$STORAGE_HTTP_CODE" != "200" ] &&
         [ "$STORAGE_HTTP_CODE" != "201" ]; then
        echo "Reference-data seeding failed with HTTP ${STORAGE_HTTP_CODE}"
        cat "$CI_PROJECT_DIR/reference-data-seed-response.json"
        exit 1
      fi

      echo "Ensuring seeded reference-data records are active"

      jq -r '.[].id' "$RENDERED_CATALOG" > "$RECORD_IDS"

      while IFS= read -r RECORD_ID; do
        ENCODED_RECORD_ID="$(jq -rn \
          --arg record_id "$RECORD_ID" \
          '$record_id | @uri')"

        RESTORE_HTTP_CODE="$(curl --silent --show-error --insecure \
          --output "$RESTORE_RESPONSE" \
          --write-out "%{http_code}" \
          --request PATCH "${STORAGE_URL}/records/${ENCODED_RECORD_ID}" \
          --header "Authorization: Bearer ${ACCESS_TOKEN}" \
          --header "data-partition-id: ${CIMPL_TENANT}" \
          --header "Content-Type: application/merge-patch+json" \
          --data-binary '{"deleted":false}')"

        RESTORE_ACCEPTED=false

        if [ "$RESTORE_HTTP_CODE" = "200" ] ||
           [ "$RESTORE_HTTP_CODE" = "204" ]; then
          RESTORE_ACCEPTED=true
        elif [ "$RESTORE_HTTP_CODE" = "400" ] &&
             jq -e '.message == "Record State already updated"' \
               "$RESTORE_RESPONSE" >/dev/null; then
          RESTORE_ACCEPTED=true
        fi

        if [ "$RESTORE_ACCEPTED" != "true" ]; then
          echo "Failed to reactivate ${RECORD_ID}: HTTP ${RESTORE_HTTP_CODE}"
          cat "$RESTORE_RESPONSE"
          exit 1
        fi

        VERIFY_HTTP_CODE="$(curl --silent --show-error --insecure \
          --output "$VERIFY_RESPONSE" \
          --write-out "%{http_code}" \
          --request GET "${STORAGE_URL}/records/${ENCODED_RECORD_ID}" \
          --header "Authorization: Bearer ${ACCESS_TOKEN}" \
          --header "data-partition-id: ${CIMPL_TENANT}")"

        if [ "$VERIFY_HTTP_CODE" != "200" ]; then
          echo "Record remains inactive after PATCH: ${RECORD_ID}"
          echo "PATCH response:"
          cat "$RESTORE_RESPONSE"
          echo
          echo "GET response:"
          cat "$VERIFY_RESPONSE"
          echo
          exit 1
        fi
      done < "$RECORD_IDS"

      echo "Successfully seeded, activated, and verified ${REFERENCE_DATA_COUNT} RAFS integration reference-data records"

  artifacts:
    when: always
    paths:
      - legal-tag-response.json
      - reference-data-seed-response.json
    expire_in: 1 week

# Ensure CIMPL-STACK DEV waits for both RAFS service images.
cimpl-dev-deploy:
  needs:
    - job: cimpl-containerize-gitlab
    - job: cimpl-cronjob-containerize-gitlab
    - job: cimpl-helm-charts-gitlab
    - job: cimpl-helm-charts-release-gitlab
      optional: true

# Seed the reference and master-data records required by RAFS tests.
cimpl-dev-seed-reference-data:
  extends:
    - .rafs_cimpl_reference_bootstrap
    - .cimpl-dev-variables
  variables:
    CIMPL_SEED_HOSTNAME: "${CIMPL_DOMAIN}"
  needs:
    - job: cimpl-dev-deploy
  rules:
    - if: '$DISABLE_INTEGRATION_TEST == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^release/'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CIMPL_STACK == "1" && $DEV == "1"'
      when: on_success
    - when: never

# Run the RAFS pytest suite against CIMPL-STACK DEV.
cimpl-dev-test-python:
  allow_failure: true  # TODO: Remove when issue #834 is resolved.
  extends:
    - .cimpl-dev-variables
    - .rafs_cimpl_pytest_integration
  image: ${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHA}
  stage: integration
  tags: ["osdu-medium"]
  variables:
    CIMPL_RAFS_BASE_URL: "https://${CIMPL_DOMAIN}"
    SERVICE_HOST_STORAGE: "${CIMPL_RAFS_BASE_URL}/api/storage/v2"
    SERVICE_HOST_LEGAL: "${CIMPL_RAFS_BASE_URL}/api/legal/v1"
    SERVICE_HOST_SEARCH: "${CIMPL_RAFS_BASE_URL}/api/search/v2"
  before_script:
    - !reference [.rafs_cimpl_pytest_integration, before_script]
  script:
    - !reference [.rafs_cimpl_pytest_integration, script]
  after_script:
    - !reference [.rafs_cimpl_pytest_integration, after_script]
  artifacts:
    paths:
      - tests/cimpl/allure-results/
      - allure-report/
    reports:
      junit: integration_tests_report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 1 week
  needs:
    - job: build_rafs_tests
    - job: cimpl-dev-deploy
    - job: cimpl-dev-seed-reference-data

cimpl-helm-charts-release-gitlab:
  stage: containerize
  tags: ["osdu-small"]
  needs: ["cimpl-containerize-gitlab"]
  image:
    name: alpine/helm:3.11.2
    entrypoint: [""]
  before_script:
    - helm registry login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # set & substitute service images in helm chart
    - !reference [.cimpl_set_image_name, script]
    - !reference [.cimpl_substitute_service_images_in_helm, script]
    # set & substitute cronjob image in helm chart
    - CIMPL_IMAGE_NAME="$CIMPL_IMAGE_CRONJOB_NAME"
    - !reference [.cimpl_set_image_name, script]
    - !reference [.cimpl_substitute_cronjob_image_in_helm, script]
    - cat $CIMPL_HELM_DEPLOYMENT_DIR/values.yaml | grep -i image
  script:
    - !reference [.cimpl_define_version, script]
    - helm package $CIMPL_HELM_DEPLOYMENT_DIR -u --version $VERSION --app-version $APP_VERSION
    - helm push $CIMPL_HELM_PACKAGE_NAME-$VERSION.tgz oci://$CI_REGISTRY_IMAGE/cimpl-helm

# prod jobs
# Upstream cimpl-prod-test-python runs baremetal run-integration-tests.sh, which RAFS
# does not ship. Route prod integration/acceptance through pytest and Newman instead.
#
# Prod host layout (from cimpl-prod-variables):
#   CIMPL_DOMAIN=prod.osdu-main.osdu-cimpl.opengroup.org
#   API: https://$CIMPL_DOMAIN (no tenant subdomain)
#   Keycloak: https://keycloak-$CIMPL_DOMAIN (hyphen), via TEST_OPENID_PROVIDER_URL

cimpl-prod-seed-reference-data:
  extends:
    - .rafs_cimpl_reference_bootstrap
    - .cimpl-prod-variables
  needs:
    - job: cimpl-prod-deploy
  variables:
    CIMPL_RAFS_BASE_URL: "https://${CIMPL_DOMAIN}"
    CIMPL_SEED_HOSTNAME: "${CIMPL_DOMAIN}"
    CIMPL_SEED_OIDC_BASE: "https://keycloak-${CIMPL_DOMAIN}/realms/osdu"

  rules:
    - if: '$CIMPL_STACK == "1" && $CI_COMMIT_BRANCH =~ /^release/'
      when: on_success
    - if: '$CIMPL_STACK == "1" && $CI_COMMIT_TAG'
      when: on_success
    - when: never

cimpl-prod-test-python:
  extends:
    - .rafs_cimpl_pytest_integration
    - .cimpl-prod-variables
  image: ${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHA}
  tags: ["osdu-medium"]
  variables:
    CIMPL_RAFS_BASE_URL: "https://${CIMPL_DOMAIN}"
    SERVICE_HOST_STORAGE: https://${CIMPL_DOMAIN}/api/storage/v2
    SERVICE_HOST_LEGAL: https://${CIMPL_DOMAIN}/api/legal/v1
    SERVICE_HOST_SEARCH: https://${CIMPL_DOMAIN}/api/search/v2
  before_script:
    - !reference [.rafs_cimpl_pytest_integration, before_script]
  script:
    - !reference [.rafs_cimpl_pytest_integration, script]
  after_script:
    - !reference [.rafs_cimpl_pytest_integration, after_script]
  artifacts:
    paths:
      - tests/cimpl/allure-results/
      - allure-report/
    reports:
      junit: integration_tests_report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 1 week
  needs:
    - job: build_rafs_tests
    - job: cimpl-prod-deploy
    - job: cimpl-prod-seed-reference-data
      optional: true
  # Wait for reference-data seeding when the job is present in this pipeline.

.rafs_cimpl_newman_prod_acceptance:
  stage: acceptance
  image: node:alpine
  tags: ["osdu-medium"]
  variables:
    ENVIRONMENT: "./devops/core-plus/qa/Postman Collection/Environment/OSDU_CI.postman_environment.json"
    COLLECTION_JSON: "./devops/core-plus/qa/Postman Collection/Collection/RAFS DDMS.postman_collection.json"
    ALLURE_RESULTS_DIR: "tests/cimpl/allure-results"
  before_script:
    - apk add --no-cache curl bash jq
    - npm install -g newman newman-reporter-allure
  script:
    - sleep 200
    - echo "▶️ Starting Newman acceptance tests"
    - |
      mkdir -pv "tests/cimpl"
      cd "tests/cimpl"
      set +e
      { newman run "$CI_PROJECT_DIR/$COLLECTION_JSON" \
          -e "$CI_PROJECT_DIR/$ENVIRONMENT" \
          --env-var "TENANT_ID=${CIMPL_TENANT}" \
          --env-var "CLIENT_ID=${CIMPL_CLIENT_ID}" \
          --env-var "CLIENT_SECRET=${CIMPL_CLIENT_SECRET}" \
          --env-var "HOSTNAME=${CIMPL_DNS_NAME}" \
          --env-var "Token_Fetch_URL=${CIMPL_TOKEN_URI}" \
          --reporters cli,allure \
          --insecure; echo $? > /tmp/newman_exit; } 2>&1 | tee "$CI_PROJECT_DIR/newman.log"
      NEWMAN_EXIT_CODE=$(cat /tmp/newman_exit)
      set -e
    - |
      if [ "$NEWMAN_EXIT_CODE" -ne 0 ]; then
        echo "❌ Newman acceptance tests failed (exit code $NEWMAN_EXIT_CODE)"
        exit $NEWMAN_EXIT_CODE
      fi
  artifacts:
    when: always
    paths:
      - tests/cimpl/allure-results/
      - newman.log
    expire_in: 1 week

cimpl-prod-acceptance-test-python:
  extends:
    - .cimpl-prod-variables
    - .rafs_cimpl_newman_prod_acceptance
  image: node:alpine
  before_script:
    - !reference [.rafs_cimpl_newman_prod_acceptance, before_script]
  script:
    - !reference [.rafs_cimpl_newman_prod_acceptance, script]
  artifacts:
    when: always
    paths:
      - tests/cimpl/allure-results/
      - newman.log
    expire_in: 1 week
  needs:
    - job: cimpl-prod-test-python

# osdu-main DEV-BACKUP Env

cimpl-dev-backup-deploy:
  needs:
    - job: cimpl-containerize-gitlab
    - job: cimpl-cronjob-containerize-gitlab
    - job: cimpl-helm-charts-gitlab
    - job: cimpl-helm-charts-release-gitlab
      optional: true

# Seed the reference and master-data records required by RAFS tests.
cimpl-dev-backup-seed-reference-data:
  extends:
    - .rafs_cimpl_reference_bootstrap
    - .cimpl-dev-backup-variables
  variables:
    CIMPL_SEED_HOSTNAME: "${CIMPL_DOMAIN}"
  needs:
    - job: cimpl-dev-backup-deploy
  rules:
    - if: '$DISABLE_INTEGRATION_TEST == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^release/'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CIMPL_STACK == "1" && $DEV_BACKUP == "1"'
      when: on_success
    - when: never

# Run the RAFS pytest suite against CIMPL-STACK DEV.
cimpl-dev-backup-test-python:
  allow_failure: true  # TODO: Remove when issue #834 is resolved.
  extends:
    - .cimpl-dev-backup-variables
    - .rafs_cimpl_pytest_integration
  image: ${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHA}
  stage: integration
  tags: ["osdu-medium"]
  variables:
    CIMPL_RAFS_BASE_URL: "https://${CIMPL_DOMAIN}"
    SERVICE_HOST_STORAGE: "${CIMPL_RAFS_BASE_URL}/api/storage/v2"
    SERVICE_HOST_LEGAL: "${CIMPL_RAFS_BASE_URL}/api/legal/v1"
    SERVICE_HOST_SEARCH: "${CIMPL_RAFS_BASE_URL}/api/search/v2"
  before_script:
    - !reference [.rafs_cimpl_pytest_integration, before_script]
  script:
    - !reference [.rafs_cimpl_pytest_integration, script]
  after_script:
    - !reference [.rafs_cimpl_pytest_integration, after_script]
  artifacts:
    paths:
      - tests/cimpl/allure-results/
      - allure-report/
    reports:
      junit: integration_tests_report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 1 week
  needs:
    - job: build_rafs_tests
    - job: cimpl-dev-backup-deploy
    - job: cimpl-dev-backup-seed-reference-data
