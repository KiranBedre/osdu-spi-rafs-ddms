# -------------------------------------------------------------------------
# Template for Newman RAFS tests
# -------------------------------------------------------------------------
.cimpl_newman_rafs_tests:
  environment:
    name: cimpl
  tags: ["osdu-medium"]
  stage: integration
  image:
    name: node:alpine
  before_script:
  - apk add --no-cache curl bash jq
  - npm install -g newman newman-reporter-allure
  script:
  - sleep 200  # Waiting for services to be ready
  - echo "▶️ Starting Newman tests"
  - |
    mkdir -pv "tests/cimpl"
    cd "tests/cimpl"
    set +e
    { newman run "$CI_PROJECT_DIR/$COLLECTION_JSON" \
        -e "$CI_PROJECT_DIR/$ENVIRONMENT" \
        --env-var "TENANT_ID=${CIMPL_TENANT}" \
        --env-var "CLIENT_ID=${CIMPL_CLIENT_ID}" \
        --env-var "CLIENT_SECRET=${CIMPL_CLIENT_SECRET}" \
        --env-var "HOSTNAME=${CIMPL_DNS_NAME}" \
        --env-var "Token_Fetch_URL=${CIMPL_TOKEN_URI}" \
        --reporters cli,allure \
        --insecure; echo $? > /tmp/newman_exit; } 2>&1 | tee "$CI_PROJECT_DIR/newman.log"
    NEWMAN_EXIT_CODE=$(cat /tmp/newman_exit)
    set -e
  - |
    if [ "$NEWMAN_EXIT_CODE" -ne 0 ]; then
      echo "❌ Newman tests failed (exit code $NEWMAN_EXIT_CODE)"
      exit $NEWMAN_EXIT_CODE
    fi
  artifacts:
    when: always
    paths:
      - $ALLURE_RESULTS_DIR
      - newman.log
    expire_in: 1 month

# --------------------------------------------------------------------------------
# This job is for running the Postman collection for the RAFS DDMS API 
# against the OSDU Community Implementation (CI) environment.
# --------------------------------------------------------------------------------

# Run the RAFS Postman collection against the CIMPL-STACK DEV environment.
cimpl-dev-acceptance-test-postman:
  extends:
    - .cimpl_newman_rafs_tests
    - .cimpl-dev-variables
  stage: acceptance
  variables:
    ENVIRONMENT: "./devops/core-plus/qa/Postman Collection/Environment/OSDU_CI.postman_environment.json"
    COLLECTION_JSON: "./devops/core-plus/qa/Postman Collection/Collection/RAFS DDMS.postman_collection.json"
    ALLURE_RESULTS_DIR: "tests/cimpl/allure-results"
  allow_failure: true
  needs:
    - job: cimpl-dev-seed-reference-data
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release/'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CIMPL_STACK == "1" && $DEV == "1"'
      when: on_success
    - when: never

# Run the RAFS Postman collection against the CIMPL-STACK DEV environment.
cimpl-dev-backup-acceptance-test-postman:
  extends:
    - .cimpl_newman_rafs_tests
    - .cimpl-dev-backup-variables
  stage: acceptance
  variables:
    ENVIRONMENT: "./devops/core-plus/qa/Postman Collection/Environment/OSDU_CI.postman_environment.json"
    COLLECTION_JSON: "./devops/core-plus/qa/Postman Collection/Collection/RAFS DDMS.postman_collection.json"
    ALLURE_RESULTS_DIR: "tests/cimpl/allure-results"
  allow_failure: true
  needs:
    - job: cimpl-dev-backup-seed-reference-data
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release/'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CIMPL_STACK == "1" && $DEV_BACKUP == "1"'
      when: on_success
    - when: never