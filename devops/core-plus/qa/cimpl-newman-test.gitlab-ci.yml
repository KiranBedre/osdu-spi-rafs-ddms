# -------------------------------------------------------------------------
# Template for Newman RAFS tests
# -------------------------------------------------------------------------
.cimpl_newman_rafs_tests:
  environment:
    name: cimpl
  extends: .cimpl-variables
  tags: ["osdu-medium"]
  stage: integration
  image:
    name: dannydainton/htmlextra
    entrypoint: [""]
  needs: 
    - "cimpl-deploy"
  before_script:
  - apk add --no-cache curl bash jq
  script:
  - sleep 200  # Waiting for services to be ready
  - echo "🛠 Generating custom Newman HTML template" # Generating custom Newman HTML template with Request Description section removed. Reason: Request descriptions contain sensitive data (e.g., bearer tokens, client secrets), and at the moment there is no any flag for "newman run" command that allows us to solve this problem.
  - |
    set -e 
    ORIG=$(npm root -g)/newman-reporter-htmlextra/lib/dashboard-template.hbs
    if [[ ! -f "$ORIG" ]]; then
      echo "❌ Template dashboard-template.hbs not found — check image/installation"
      exit 1
    fi
    cp "$ORIG" ./custom-dashboard-template.hbs
    sed -i '/{{#if description.content}}/,/{{\/if}}/d' ./custom-dashboard-template.hbs
    echo "✅ Custom template generated"
  - echo "▶️ Starting Newman tests"
  - |
    set -o pipefail
    newman run "$COLLECTION_JSON" \
      -e "$ENVIRONMENT" \
      --env-var "TENANT_ID=${CIMPL_TENANT}" \
      --env-var "CLIENT_ID=${TEST_EPAM_OPENID_PROVIDER_CLIENT_ID}" \
      --env-var "CLIENT_SECRET=${CIMPL_TEST_EPAM_OPENID_PROVIDER_CLIENT_SECRET}" \
      --reporters cli,htmlextra \
      --reporter-htmlextra-template ./custom-dashboard-template.hbs \
      --reporter-htmlextra-export $REPORT_HTML \
      --reporter-htmlextra-title "RAFS DDMS API Tests" \
      --reporter-htmlextra-skipHeaders "Authorization" \
      --reporter-htmlextra-hideResponseBody "Refresh Token" \
      --reporter-htmlextra-hideRequestBody "Refresh Token" \
      --insecure 2>&1 | tee newman.log
    NEWMAN_EXIT_CODE=$?
  - rm -f ./custom-dashboard-template.hbs || true
  - echo "🧹 Custom template removed"
  - |
    bash <<'EOF'
    echo "🔍 Scanning $REPORT_HTML for secrets"
    declare -A SECRET_PATTERNS=(
      ['Bearer [A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+']='bearer token'
      ['client_secret&quot;:&quot;[^&]+']='client_secret'
      ['access_token&quot;:&quot;[^&]+']='access_token'
    )
    FOUND=0
    for PATTERN in "${!SECRET_PATTERNS[@]}"; do
      COUNT=$(grep -Eoic "$PATTERN" "$REPORT_HTML")
      if [[ $COUNT -gt 0 ]]; then
        echo -e "\e[41m❌ $COUNT line(s) found with ${SECRET_PATTERNS[$PATTERN]} — ⚠️ Please make sure that confidential data is not included in the report.\!\e[0m"
        FOUND=1
      fi
    done
    if [[ $FOUND -eq 1 ]]; then
      exit 1
    fi
    EOF
  - echo "Test Artifacts Summary"
  - echo "📝 HTML report ${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/$REPORT_HTML"
  - echo "📜 Logs ${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/newman.log"
  - |
    if [ "$NEWMAN_EXIT_CODE" -ne 0 ]; then
      echo "❌ Newman tests failed (exit code $NEWMAN_EXIT_CODE)"
      exit $NEWMAN_EXIT_CODE
    fi
  artifacts:
    when: always
    paths:
      - $REPORT_HTML
      - newman.log
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^release/ || $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_REF_NAME =~ /^trusted-/ && $CIMPL == "1"
      when: on_success
    - if: $CI_COMMIT_REF_NAME == "main"
      when: on_success
    - when: never

# --------------------------------------------------------------------------------
# This job is for running the Postman collection for the RAFS DDMS API 
# against the OSDU Community Implementation (CI) environment.
# --------------------------------------------------------------------------------
cimpl-postman-test:
  extends: .cimpl_newman_rafs_tests
  variables:
    ENVIRONMENT: "./devops/core-plus/qa/Postman Collection/Environment/OSDU_CI.postman_environment.json"
    COLLECTION_JSON: "./devops/core-plus/qa/Postman Collection/Collection/RAFS DDMS.postman_collection.json"
    REPORT_HTML: "report-newman.html"
  allow_failure: true

cimpl-acceptance-test-postman:
  extends: .cimpl_newman_rafs_tests
  stage: acceptance
  variables:
    ENVIRONMENT: "./devops/core-plus/qa/Postman Collection/Environment/OSDU_CI.postman_environment.json"
    COLLECTION_JSON: "./devops/core-plus/qa/Postman Collection/Collection/RAFS DDMS.postman_collection.json"
    REPORT_HTML: "report-newman.html"
  allow_failure: true
