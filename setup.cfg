[isort]
profile = black
line_length = 120

[pylint]
disable =
    import-error,
    parse-error
ignore-paths = tests,tests/integration,devops/aws
extension-pkg-whitelist = "pydantic"
max-args = 12
enable = logging-not-lazy, logging-format-interpolation

[darglint]
docstring_style = sphinx

[flake8]
format = default
count = true
max-line-length = 120
max-imports = 30
max-arguments = 10
max-local-variables = 10
max-methods = 15
max-module-expressions = 20
max-line-complexity = 20
max-jones-score = 20
max-awaits = 7
max-expressions = 20
max-function-length = 70
max-parameters-amount = 10
max-cognitive-complexity = 8
max-noqa-comments = 10

exclude =
    app/models/*
    tests/*
    app/services/dataset_dms_client.py
    app/api/routes/samplesanalysis/endpoints.py
    demo/*
    devops/aws/*
    scripts/*
    notebooks/*

ignore =
    # Docstrings
    D,
    # Do not perform function calls in argument defaults.
    B008,
    # Found `noqa` comments overuse
    WPS402,
    # Found complex default value (for dependency injection)
    WPS404,
    # Found string literal over-use
    WPS226,
    # Found `f` string
    WPS305,
    # WPS114 Found underscored number name pattern
    WPS114,
    # WPS420 Found wrong keyword
    WPS420,
    # WPS115 Found upper-case constant in a class
    WPS115,
    # N818 exception name should be named with an Error suffix
    N818,
    # WPS412 Found `__init__.py` module with logic
    WPS412,
    # WPS602 Found using `@staticmethod`
    WPS602,
    # WPS605 Found method without arguments
    WPS605,
    # Found too long try body length
    WPS229,
    # WPS100 Found wrong module name
    WPS100,
    # Found incorrect node inside `class` body
    WPS604,
    # T101 fixme found (TODO)
    T101,
    # G004 Logging statement uses f-string (for loguru f-strings work fine)
    G004,
    # WPS232 Found module cognitive complexity
    WPS232,
    # WPS453 Found executable mismatch: file is executable but no shebang is present
    WPS453,
    # FIXME: temporary workaround — isort errors I001, I005 disabled
    I001,
    I005,

inline-quotes = double

per-file-ignores =
    tests/*:S101,S105,WPS202,WPS210,WPS235,WPS306,WPS407,WPS430,WPS432,WPS433,WPS437,WPS442
    demo/*:WPS421
    app/resources/*:WPS411
    app/api/routes/api.py:WPS201,WPS210,WPS231,WPS232,WPS323
    app/api/routes/utils.py:WPS221
    app/api/routes/data/api.py:WPS201,WPS210,WPS231,WPS430
    app/api/routes/utils/ddms_datasets.py:WPS210,WPS504
    app/api/routes/utils/records.py:WPS202,WPS210
    app/api/routes/utils/gc_collector.py:WPS430
