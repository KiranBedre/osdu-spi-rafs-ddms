version: 2
updates:
  # Workflow and action updates arrive through template sync.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      python-patch-updates:
        update-types:
          - "patch"
