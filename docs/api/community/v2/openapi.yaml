  /api/rafs-ddms/v2/depthshift:
    post:
      description: 'Create or update `DepthShift` record(s). The `Content-Type: application/json`
        request header is required.<br><br>        Required roles: `users.datalake.editors`
        or `users.datalake.admins`.<br>         In addition, users must be members
        of a data group(ACL) to access the data.'
      operationId: post_records_api_rafs_ddms_v2_depthshift_post
      parameters:
      - description: Specifies the proper data partition id
        examples:
          example:
            value: opendes
        in: header
        name: data-partition-id
        required: true
        schema:
          description: Specifies the proper data partition id
          title: data-partition-id
          type: string
      requestBody:
        content:
          application/json:
            examples:
              example:
                value:
                - acl:
                    owners:
                    - data.default.owners@osdu.example.com
                    viewers:
                    - data.default.viewers@osdu.example.com
                  data:
                    AuthorID:
                      EmailAddress: analyst@company.com
                      Name: Depth Shift Analyst
                    DepthShiftTypeID: 'namespace:reference-data--DepthShiftType:Manual:'
                    DepthShiftedSamples:
                    - SampleID: 'namespace:master-data--Sample:sample-001:'
                      Usage: Primary
                    ExtensionProperties: {}
                    Remarks:
                    - Remark: Depth shift generated using gamma ray alignment.
                      RemarkDate: '2020-02-13'
                      RemarkSequenceNumber: 1
                    ShiftedSamplingDomainTypeID: 'namespace:reference-data--WellLogSamplingDomainType:Depth:'
                    VerticalReferenceRecordCurveIDs:
                    - GR
                    VerticalReferenceRecordID: 'namespace:work-product-component--WellLog:well-log-001:'
                    WellboreID: 'namespace:master-data--Wellbore:wellbore-001:'
                  id: namespace:work-product-component--DepthShift:depth-shift-1
                  kind: osdu:wks:work-product-component--DepthShift:1.0.0
                  legal:
                    legaltags:
                    - opendes-public-usa-dataset-1
                    otherRelevantDataCountries:
                    - US
                    status: compliant
            schema:
              items:
                additionalProperties: true
                type: object
              title: Request Records
              type: array
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageUpsertResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Post Records
      tags:
      - depthshift
