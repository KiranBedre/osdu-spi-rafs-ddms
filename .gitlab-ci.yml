variables:
  DDMS_NAME: rafs
  GIT_DEPTH: 20
  URL_PREFIX: api/rafs-ddms
  CIMPL_OPENAPI_YAML_ROUTE: /api/rafs-ddms/openapi.json
  CIMPL_OPENAPI_SPEC_PATH: docs/api/community/v2/openapi.yaml
  REDIS_IMAGE_VERSION: redis/redis-stack-server:7.4.0-v8

  # Azure specific
  AZURE_TEST_TYPE: python
  AZURE_SKIP_COVERAGE: "true"

  # AWS specific
  AWS_BUILD_SUBDIR: ./
  AWS_SERVICE: rafs-ddms
  AWS_DEPLOY_TARGET: TF
  AWS_SERVICE_NAMESPACE_SUFFIX: rafs-ddms
  AWS_EKS_DEPLOYMENT_NAME: os-rafs-ddms

include:
  
  # IMPORTS FROM CENTRAL CI/CD REPOSITORY (https://community.opengroup.org/osdu/platform/ci-cd-pipelines)

  # standard pipeline setup
  - project: "osdu/platform/ci-cd-pipelines"
    ref: release/0.30
    file: "standard-setup.yml"

  # build stage
  - project: "osdu/platform/ci-cd-pipelines"
    ref: release/0.30
    file: "build/python.yml"

  # fossa scan
  - project: "osdu/platform/ci-cd-pipelines"
    ref: release/0.30
    file: "scanners/fossa-python.yml"

  # gitlab ultimate scan
  - project: "osdu/platform/ci-cd-pipelines"
    ref: release/0.30
    file: "scanners/gitlab-ultimate.yml"

  # Community/OSDU
  - local: "/devops/osdu/.osdu.gitlab-ci.yml"

  # AZURE provider
  - project: "osdu/platform/ci-cd-pipelines"
    ref: release/0.30
    file: "cloud-providers/azure.yml"

  # AWS provider
  - project: "osdu/platform/ci-cd-pipelines"
    ref: release/0.30
    file: "cloud-providers/aws-global.yml"

  # GC provider
  - project: "osdu/platform/ci-cd-pipelines"
    ref: release/0.30
    file: "cloud-providers/gc-global.yml"

  # CI provider
  - project: "osdu/platform/ci-cd-pipelines"
    ref: release/0.30
    file: "cloud-providers/cimpl-global.yml"

  # CIMPL-STACK DEV environment, pinned for reproducible validation
  - project: "osdu/platform/ci-cd-pipelines"
    ref: b723a27d6787c7f7c295cecd8e755c9e9430f3e6
    file: "cloud-providers/cimpl-dev-rosa.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    ref: b723a27d6787c7f7c295cecd8e755c9e9430f3e6
    file: "cloud-providers/cimpl-dev-variables.yml"

  # CI provider - OpenAPI spec validation
  - project: "osdu/platform/ci-cd-pipelines"
    ref: release/0.30
    file: "cloud-providers/cimpl-openapi.yml"

  # reporting stage
  - project: "osdu/platform/ci-cd-pipelines"
    ref: release/0.30
    file: "reporting/reporting.yml"

  # OVERRIDE STAGES

  # general
  - local: "/devops/osdu/override-stages.yml"

  # AZURE provider
  - local: "/devops/azure/override-stages.yml"

  # AWS provider
  - local: "/devops/aws/override-stages.yml"

  # GC provider
  - local: "devops/gc/pipeline/override-stages.yml"

  # CI provider
  - local: "devops/core-plus/override-stages.yml"

  # ADD SERVICE SPECIFIC JOBS

  # add service specific build jobs
  - local: "/devops/osdu/.rafs.gitlab-ci.yml"

  # AZURE provider
  - local: "/devops/azure/qa/newman-test.gitlab-ci.yml"

  # CI provider
  - local: "devops/core-plus/qa/cimpl-newman-test.gitlab-ci.yml"
