variables:
  DDMS_NAME: rafs
  GIT_DEPTH: 20
  URL_PREFIX: api/rafs-ddms

  # Azure specific
  AZURE_TEST_TYPE: python
  AZURE_SKIP_COVERAGE: "true"

  # AWS specific
  AWS_BUILD_SUBDIR: ./
  AWS_SERVICE: rafs-ddms
  AWS_DEPLOY_TARGET: TF
  AWS_SERVICE_NAMESPACE_SUFFIX: rafs-ddms
  AWS_EKS_DEPLOYMENT_NAME: os-rafs-ddms

include:
  
  # IMPORTS FROM CENTRAL CI/CD REPOSITORY (https://community.opengroup.org/osdu/platform/ci-cd-pipelines)

  # standard pipeline setup
  - project: "osdu/platform/ci-cd-pipelines"
    file: "standard-setup.yml"

  # build stage
  - project: "osdu/platform/ci-cd-pipelines"
    file: "build/python.yml"

  # fossa scan
  - project: "osdu/platform/ci-cd-pipelines"
    file: "scanners/fossa-python.yml"

  # gitlab ultimate scan
  - project: "osdu/platform/ci-cd-pipelines"
    file: "scanners/gitlab-ultimate.yml"

  # Community/OSDU
  - local: "/devops/osdu/.osdu.gitlab-ci.yml"

  # AZURE provider
  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/azure.yml"

  # AWS provider
  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/aws-global.yml"

  # GC provider
  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/gc-global.yml"

  # OVERRIDE STAGES
  
  # general
  - local: "/devops/osdu/override-stages.yml"
  
  # AZURE provider
  - local: "/devops/azure/override-stages.yml"

  # AWS provider
  - local: "/devops/aws/override-stages.yml"

  # GC provider
  - local: "devops/gc/pipeline/override-stages.yml"

  # ADD SERVICE SPECIFIC JOBS

  # add service specific build jobs
  - local: "/devops/osdu/.rafs.gitlab-ci.yml"

  # AZURE provider
  - local: "/devops/azure/qa/newman-test.gitlab-ci.yml"
