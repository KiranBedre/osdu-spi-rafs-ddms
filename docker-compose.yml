version: '3.8'

services:
  rafs:
    user: "0:0"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        commit_branch: "Local"
        commit_message: "Local Development"
        release_version: "0.0.0-local"
        # Embed cache in image layers (works with default docker driver)
        # This allows cache to be stored within the image itself
        BUILDKIT_INLINE_CACHE: 1
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./app/:/app/app
    entrypoint: ["/app/uvicorn"]
    command: ["app.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1", "--reload"]
    depends_on:
      - redis

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
      args:
        # Embed cache in image layers for test builds (works with default docker driver)
        BUILDKIT_INLINE_CACHE: 1
    image: osdu-rafsddms_tests
    security_opt:
      - no-new-privileges:true
    restart: "no"
    volumes:
      - ./app:/app
      - ./setup.cfg:/setup.cfg
      - ./tests/:/tests
      - ./client/:/client
    entrypoint: [ "bash", "-c"]
    profiles: ["tests"]
    command: ["python -m pytest -p no:cacheprovider --ignore=integration"]

  integration:
    image: osdu-rafsddms_tests
    security_opt:
      - no-new-privileges:true
    restart: "no"
    env_file:
      - .env
    environment:
      - DDMS_BASE_URL
      - URL_PREFIX
      - PARTITION
      - ACCESS_TOKEN
      - CLOUD_PROVIDER
      - DOMAIN
    volumes:
      - ./tests/:/tests
      - ./client/:/client
    working_dir: /
    entrypoint: [ "bash", "-c",
      "time pytest -n 1 --cov=app --cov-report=term ./tests/integration/tests --ddms-base-url \"$${DDMS_BASE_URL:-http://rafs:8080}\" --url-prefix \"$${URL_PREFIX}\" --partition \"$${PARTITION}\" --bearer-token \"$${ACCESS_TOKEN}\" --cloud-provider \"$${CLOUD_PROVIDER}\" --domain \"$${DOMAIN}\""]
    profiles: ["tests"]
    depends_on:
      - rafs
      - tests

  cache_tests:
    image: osdu-rafsddms_tests
    security_opt:
      - no-new-privileges:true
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./tests/:/tests
    working_dir: /
    entrypoint: [ "bash", "-c"]
    command: ["pytest -v ./tests/test_cache_integration"]
    profiles: ["tests"]
    depends_on:
      - redis

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    profiles: ["otel"]

  redis:
    image: redis/redis-stack-server:latest
    security_opt:
      - no-new-privileges:true
    ports:
      - "6379:6379"
    command: ["redis-stack-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./local_redis.conf:/usr/local/etc/redis/redis.conf
