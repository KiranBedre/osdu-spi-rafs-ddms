repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: debug-statements
      - id: trailing-whitespace
        files: "(app)|(tests)|(client)"
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)"

# # Formatters (stable order): autoflake -> isort -> black

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.3
    hooks:
      - id: autoflake
        files: "\\.py$"
        args:
          - --remove-all-unused-imports
          - --remove-unused-variables
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)"
        language_version: python3.12

  - repo: https://github.com/pycqa/isort
    rev: 8.0.0
    hooks:
      - id: isort
        files: "\\.py$"
        args: ["--profile=black"]
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)"
        language_version: python3.12

  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        files: "\\.py$"
        args: ["--line-length=120"]
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)"
        language_version: python3.12

# Linters

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          - setuptools==82.0.0
          - wemake-python-styleguide==1.5.0
          - darglint==1.8.1
          - flake8-async==25.7.1
          - flake8-bandit==4.1.1
          - flake8-blind-except==0.2.1
          - flake8-broken-line==1.0.0
          - flake8-cognitive-complexity==0.1.0
          - flake8-comprehensions==3.17.0
          - flake8-debugger==4.1.2
          - flake8-docstrings==1.7.0
          - flake8-eradicate==1.5.0
          - flake8-functions==0.0.8
          - flake8-polyfill==1.0.2
          - flake8-quotes==3.4.0
          - flake8-rst-docstrings==0.4.0
          - flake8-string-format==0.3.0
          - pep8-naming==0.15.0
        args: [--config=setup.cfg]
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)|(scripts)"
        language_version: python3.12

  - repo: https://github.com/PyCQA/pylint
    rev: v4.0.5
    hooks:
      - id: pylint
        args:
          - --rcfile=setup.cfg
          - --errors-only
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)"

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)"

  - repo: https://github.com/leoll2/copyright_notice_precommit
    rev: 0.1.1
    hooks:
      - id: copyright-notice
        args:
          - --notice=copyright.txt
        files: "(app)|(tests)|(client)"
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)|(.json$)"
