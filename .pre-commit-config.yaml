repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: debug-statements
      - id: trailing-whitespace
        files: "(app)|(tests)|(client)"
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)"

# Formatters

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)"

  - repo: https://github.com/hhatto/autopep8
    rev: v2.3.2
    hooks:
      - id: autopep8
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)"
        language_version: python3.12

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.2.1
    hooks:
      - id: autoflake
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)"

#    - repo: https://github.com/PyCQA/docformatter
#      rev: v1.7.7
#      hooks:
#        - id: docformatter
#          exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)"

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v3.1.0
    hooks:
      - id: add-trailing-comma
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)"

# Linters

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies: [
          darglint==1.8.1,
          flake8-async==22.11.14,
          flake8-bandit==4.1.1,
          flake8-blind-except==0.2.1,
          flake8-broken-line==1.0.0,
          flake8-bugbear==24.8.19,
          flake8-cognitive-complexity==0.1.0,
          flake8-comprehensions==3.15.0,
          flake8-debugger==4.1.2,
          flake8-docstrings==1.7.0,
          flake8-eradicate==1.5.0,
          flake8-functions==0.0.8,
          flake8-isort==6.1.1,
          flake8-logging-format==0.9.0,
          flake8-polyfill==1.0.2,
          flake8-quotes==3.4.0,
          flake8-rst-docstrings==0.3.0,
          flake8-string-format==0.3.0,
          mccabe==0.7.0,
          pep8-naming==0.13.3,
          pycodestyle==2.12.1,
          pydocstyle==6.3.0,
          pyflakes==3.2.0,
        ]
        args: [--config=setup.cfg]
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)|(scripts)"
        language_version: python3.12

  - repo: https://github.com/PyCQA/pylint
    rev: v3.0.3
    hooks:
      - id: pylint
        args: [
          --rcfile=setup.cfg,
          --errors-only
        ]
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)"

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)"

  - repo: https://github.com/leoll2/copyright_notice_precommit
    rev: 0.1.1
    hooks:
      - id: copyright-notice
        args: [
          --notice=copyright.txt
        ]
        files: "(app)|(tests)|(client)"
        exclude: "(app/models/domain)|(app/models/data_schemas)|(devops/aws)|(.json$)"
